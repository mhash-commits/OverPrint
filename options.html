<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overprint – Library</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="layout">
    <aside class="rail">
      <div class="brand">
        <img src="icons/icon48.png" alt="">
        <span>Overprint</span>
      </div>

      <h1>Creative library</h1>
      <p id="library-count" class="count">0 of 50 creatives</p>

      <div id="drop-zone" class="drop">
        <p class="drop-title">Drop banners here</p>
        <p class="drop-hint">Put the size in the file name, like <strong>banner_728x90.png</strong>. Without a size, Overprint uses 300 × 250.</p>
        <button id="browse-btn" class="btn btn-primary" type="button">Browse files</button>
        <input type="file" id="file-input" accept="image/*" multiple>
      </div>

      <label class="option">
        <input type="checkbox" id="setting-hide-other-ads" class="switch" checked>
        <span>
          Hide other ads on the page
          <small>After a swap, other known ad slots are hidden. Ctrl/Cmd+Z brings them back.</small>
        </span>
      </label>

      <button id="reset-btn" class="btn btn-quiet" type="button">Clear library</button>
    </aside>

    <main class="sheet">
      <div id="gallery" class="gallery"></div>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
