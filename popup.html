<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overprint</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon48.png" alt="">
      <h1>Overprint</h1>
    </div>
    <button id="options-btn" class="link-btn" type="button">Library</button>
  </header>

  <section class="proof" aria-label="Preview of the selected creative in a page">
    <div class="bar b1" aria-hidden="true"></div>
    <div class="bar b2" aria-hidden="true"></div>

    <div id="stage" class="stage">
      <div id="dim" class="dim" hidden><span id="dim-label"></span></div>
      <div id="slot" class="slot">
        <img id="slot-img" alt="" hidden>
        <span id="slot-empty">Choose a creative</span>
      </div>
    </div>

    <div class="bar b3" aria-hidden="true"></div>
    <div class="bar b2" aria-hidden="true"></div>
  </section>

  <div class="controls">
    <select id="creative-select" aria-label="Creative">
      <option value="">Select a creative</option>
    </select>

    <button id="select-btn" class="btn btn-primary" type="button">Pick a slot on the page</button>
    <button id="capture-btn" class="btn btn-quiet" type="button">Copy screenshot</button>
    <p id="status" class="status" role="status"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
